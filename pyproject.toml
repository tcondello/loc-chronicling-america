[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loc-chronicling-america"
version = "0.1.0"
description = "A Python library and CLI for researchers to discover, understand, and download historical newspaper records and batches from the US Library of Congress (Chronicling America)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Tim" }
]
keywords = [
    "library-of-congress",
    "chronicling-america",
    "newspapers",
    "ocr",
    "alto-xml",
    "mets",
    "ndnp",
    "historical-data",
    "digital-humanities",
    "research"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Markup :: XML",
]
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
pipeline = [
    "pyarrow>=14.0.0",
    "huggingface_hub>=0.20.0",
]
dev = [
    "pytest>=8.0.0",
    "pyarrow>=14.0.0",
    "huggingface_hub>=0.20.0",
]

[project.urls]
Homepage = "https://github.com/tcondello/loc-chronicling-america"
Documentation = "https://github.com/tcondello/loc-chronicling-america#readme"
Repository = "https://github.com/tcondello/loc-chronicling-america"
"Hugging Face Dataset" = "https://huggingface.co/datasets/Tim-Pinecone/LOC-Chronicling-America"


[project.scripts]
loc-chronam = "loc_chronicling_america.cli:main"
chronam = "loc_chronicling_america.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/loc_chronicling_america", "src/chronicling_america"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
